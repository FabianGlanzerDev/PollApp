<section class="hero">
  <h1>
    <span>Collect Feedback,</span>
    <span>Unlock Ideas</span>
  </h1>

  <div class="hero-content">
    <p>
      Create and share surveys in minutes – from team events to workplace culture. Collect opinions,
      engage your audience, and turn feedback into action.
    </p>

    <button class="new-survey-button" type="button" (click)="openCreateSurvey()">
      <span>New survey</span>
      <span class="plus-icon" aria-hidden="true">
        <img src="assets/icons/add-circle.svg" alt="" />
      </span>
    </button>
  </div>

  <div class="smartphone" aria-hidden="true">
    <img class="smartphone-default" src="assets/images/smartphone.svg" alt="" />
    <img class="smartphone-hover" src="assets/images/smartphone-hover.svg" alt="" />
  </div>
</section>
